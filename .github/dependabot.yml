version: 2
updates:
  # Base image FROM digest pins across all Containerfiles. Dependabot only tracks
  # images pinned by digest (literal `FROM image@sha256:...`); the sandbox thin
  # layers (standard/docs/speckit/speckit-docs) build FROM our own freshly-built
  # base via ${BASE_IMAGE}, so they aren't scanned here.
  - package-ecosystem: "docker"
    directories:
      - "/sandbox/base"
      - "/standard-ghcr/qmp"
      - "/standard-quay/build-utils"
      - "/standard-quay/coredumps"
      - "/standard-quay/ssh-client"
      - "/standard-quay/storage-utils"
      - "/standard-quay/perf-utils"
      - "/micro-quay/minisleep"
      - "/micro-quay/microsleep"
      - "/micro-quay/hardenedsleep"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "sandbox"

  # AI CLI versions pinned in sandbox/base/package.json (opencode-ai,
  # @anthropic-ai/claude-code). Source of version-bump PRs for the sandbox
  # base image tooling; the Containerfile installs from that manifest.
  - package-ecosystem: "npm"
    directories:
      - "/sandbox/base"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "sandbox"

  # GitHub Actions used by the workflows (docker/*, actions/*, redhat-actions/*).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
