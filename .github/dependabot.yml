version: 2
updates:
  # Base image FROM digest pins across all Containerfiles. Dependabot only tracks
  # images pinned by digest (literal `FROM image@sha256:...`); the sandbox thin
  # layers (standard/docs/speckit/speckit-docs) build FROM our own freshly-built
  # base via ${BASE_IMAGE}, so they aren't scanned here.
  - package-ecosystem: "docker"
    directories:
      - "/sandbox/base"
      - "/sandbox/hermes"
      - "/standard-ghcr/qmp"
      - "/standard-quay/build-utils"
      - "/standard-quay/coredumps"
      - "/standard-quay/ssh-client"
      - "/standard-quay/storage-utils"
      - "/standard-quay/perf-utils"
      - "/micro-quay/minisleep"
      - "/micro-quay/microsleep"
      - "/micro-quay/hardenedsleep"
    schedule:
      interval: "weekly"
      day: "monday"
    # All docker bumps across every directory land in ONE grouped PR per
    # cycle instead of one PR per image.
    groups:
      docker-base-images:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "sandbox"

  # AI CLI versions pinned in sandbox/base/package.json (opencode-ai,
  # @anthropic-ai/claude-code). Source of version-bump PRs for the sandbox
  # base image tooling; the Containerfile installs from that manifest.
  - package-ecosystem: "npm"
    directories:
      - "/sandbox/base"
    schedule:
      interval: "weekly"
      day: "monday"
    # All npm bumps in /sandbox/base land in ONE grouped PR per cycle.
    groups:
      npm-ai-clis:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "sandbox"

  # Slack SDK pins in sandbox/hermes/requirements.txt (slack-bolt, slack-sdk)
  # — baked into the hermes layer's venv by its Containerfile so the Slack
  # platform works under the no-pypi sandbox egress policy. Same pattern as
  # the base image's npm AI-CLI pins: the manifest is the bump source and the
  # Containerfile installs from it.
  - package-ecosystem: "pip"
    directories:
      - "/sandbox/hermes"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      pip-hermes-slack:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "sandbox"

  # GitHub Actions used by the workflows (docker/*, actions/*, redhat-actions/*).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # All workflow action bumps land in ONE grouped PR per cycle.
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
