version: 2
updates:
  # Base image FROM digest pins across all Containerfiles. Dependabot only tracks
  # images pinned by digest (literal `FROM image@sha256:...`); the sandbox thin
  # layers (standard/docs/speckit/speckit-docs) build FROM our own freshly-built
  # base via ${BASE_IMAGE}, so they aren't scanned here.
  # NOTE: micro-quay images are built from buildah scripts (buildscript.sh), not
  # Containerfiles — Dependabot cannot scan them. Their bases are digest-pinned
  # and must be bumped manually (or migrated to Containerfiles).
  - package-ecosystem: "docker"
    directories:
      - "/sandbox/base"
      - "/standard-ghcr/qmp"
      - "/standard-quay/build-utils"
      - "/standard-quay/coredumps"
      - "/standard-quay/ssh-client"
      - "/standard-quay/storage-utils"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "sandbox"

  # GitHub Actions used by the workflows (docker/*, actions/*, redhat-actions/*).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
