name: Build and Push 'micro-quay' containers with podman

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'

concurrency:
  # One build lane per event class — only the LATEST activity builds.
  # NOTE: this workflow builds on pushes to main and cron only (no
  # pull_request trigger), so there is no PR lane.
  #  - pushes to main share 'main-latest': a newer merge supersedes an older
  #    queued/running publish (images are latest-tagged only — a superseded
  #    build is pure runner waste and queue delay)
  #  - cron keeps per-ref isolation so a scheduled rebuild can never cancel a
  #    newer push's publish (group cancellation is by run start order, not
  #    code recency)
  # Scoped to refs/heads/main so widening the push branch filter can never let
  # a non-main branch cancel main's publish.
  group: micro-quay-${{ github.ref == 'refs/heads/main' && 'main-latest' || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_USER: rh-ee-chbutler
  IMAGE_REGISTRY: quay.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: ['minisleep', 'microsleep', 'hardenedsleep']
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Log in to Quay.io
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
      with:
        username: ${{ env.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        registry: ${{ env.IMAGE_REGISTRY }}

    - name: Build Image
      id: build-image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
      with:
        image: ${{ matrix.containers }}
        tags: latest
        containerfiles: |
          ./micro-quay/${{ matrix.containers }}/Containerfile

    - name: Push To quay.io
      id: push-to-quay
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3
      with:
        image: ${{ matrix.containers }}
        tags: latest
        registry: quay.io/${{ env.REGISTRY_USER }}