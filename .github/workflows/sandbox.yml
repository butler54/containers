name: Build and Push 'sandbox' containers (multi-arch → ghcr.io)

# Sandbox images for the sandboxctl/openshell toolchain.
# Separate from the quay-based micro/standard workflows: these publish to
# GitHub Container Registry (ghcr.io/butler54) using the built-in GITHUB_TOKEN.
# Built multi-arch (linux/amd64 + linux/arm64) on native runners, base first.

on:
  push:
    branches: [main]
    paths:
      - 'sandbox/**'
      - '.github/workflows/sandbox.yml'
  schedule:
    # Weekly rebuild to pick up upstream package/tool updates. Off the :00 mark.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: butler54

permissions:
  contents: read
  packages: write

jobs:
  # ---- Base image: build each arch by-digest, then merge into a manifest list ----
  base:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/base/Containerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/openshell-sandbox-base,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-base-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  base-merge:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-base-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create base manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.OWNER }}/openshell-sandbox-base"
          docker buildx imagetools create -t "${IMG}:latest" \
            $(printf "${IMG}@sha256:%s " *)
          docker buildx imagetools inspect "${IMG}:latest"

  # ---- Thin layers: build each (image × arch) by-digest, then merge per image ----
  layers:
    needs: base-merge
    strategy:
      fail-fast: false
      matrix:
        image:
          - { dir: standard,     name: openshell-sandbox }
          - { dir: docs,         name: openshell-sandbox-docs }
          - { dir: speckit,      name: openshell-sandbox-speckit }
          - { dir: speckit-docs, name: openshell-sandbox-speckit-docs }
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push layer by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/${{ matrix.image.dir }}/Containerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/openshell-sandbox-base:latest
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  layers-merge:
    needs: layers
    strategy:
      fail-fast: false
      matrix:
        name:
          - openshell-sandbox
          - openshell-sandbox-docs
          - openshell-sandbox-speckit
          - openshell-sandbox-speckit-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list for ${{ matrix.name }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}"
          docker buildx imagetools create -t "${IMG}:latest" \
            $(printf "${IMG}@sha256:%s " *)
          docker buildx imagetools inspect "${IMG}:latest"
