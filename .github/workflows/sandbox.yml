name: Build and Push 'sandbox' containers (multi-arch → ghcr.io, podman/buildah)

# Sandbox images for the sandboxctl/openshell toolchain.
# Separate from the quay-based micro-quay/standard-quay workflows: these publish to
# GitHub Container Registry (ghcr.io/butler54) using the built-in GITHUB_TOKEN.
# Built multi-arch (linux/amd64 + linux/arm64) with buildah on native runners,
# base first; per-arch images are combined into a manifest list with podman.

on:
  push:
    branches: [main]
    paths:
      - 'sandbox/**'
      - '.github/workflows/sandbox.yml'
  pull_request:
    paths:
      - 'sandbox/**'
      - '.github/workflows/sandbox.yml'
  schedule:
    # Weekly rebuild to pick up upstream package/tool updates. Off the :00 mark.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: butler54

# Least privilege: read-only by default. Jobs that publish to ghcr.io declare
# `permissions: packages: write` individually, and their login/push steps are
# additionally gated on non-PR events — pull_request builds cannot publish.
permissions:
  contents: read

jobs:
  # ---- Base image: build each arch natively with buildah, push a per-arch tag ----
  base:
    # Always builds (incl. PRs — pre-merge validation, FR-006); publishes only
    # when not triggered by a pull_request.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure buildah/podman
        run: |
          command -v buildah >/dev/null && command -v podman >/dev/null || \
            { sudo apt-get update && sudo apt-get install -y buildah podman; }

      - name: Free disk space (base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base (${{ matrix.arch }})
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with:
          image: openshell-sandbox-base
          tags: latest-${{ matrix.arch }}
          archs: ${{ matrix.arch }}
          # Build context is the image dir so the Containerfile can COPY
          # sandbox/base/package.json (the pinned AI CLI version manifest).
          context: ./sandbox/base
          containerfiles: ./sandbox/base/Containerfile

      - name: Audit baked-in tool versions
        run: |
          # The image ENTRYPOINT is /bin/bash (no -c), so override it to run
          # audit commands directly rather than having bash treat them as scripts.
          echo "--- /opt/ai-cli-versions/package.json ---"
          podman run --rm --entrypoint cat localhost/openshell-sandbox-base:latest-${{ matrix.arch }} \
            /opt/ai-cli-versions/package.json
          # Assert the OpenCode major version so a silent regression to the
          # 1.x package (opencode-ai) fails the build. Output looks like
          # "opencode v2.0.28".
          OPENCODE_VERSION="$(podman run --rm --entrypoint opencode localhost/openshell-sandbox-base:latest-${{ matrix.arch }} --version)"
          echo "opencode version: ${OPENCODE_VERSION}"
          case "${OPENCODE_VERSION}" in
            *v2.*) ;;
            *) echo "::error::opencode is expected to be 2.x, got '${OPENCODE_VERSION}'" && exit 1 ;;
          esac
          podman run --rm --entrypoint claude localhost/openshell-sandbox-base:latest-${{ matrix.arch }} --version
          # Run the Electron check as root with its own timeout: matches the
          # buildah RUN context (root) where the same verification passes, and
          # timeout prevents any lingering X session from stalling the step.
          podman run --rm --user root --entrypoint timeout localhost/openshell-sandbox-base:latest-${{ matrix.arch }} \
            90 xvfb-run -a drawio --no-sandbox --disable-gpu --version

      - name: Push base (${{ matrix.arch }})
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3
        with:
          image: openshell-sandbox-base
          tags: latest-${{ matrix.arch }}
          registry: ${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}

  base-manifest:
    if: github.event_name != 'pull_request'
    needs: base
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Ensure podman
        run: command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }

      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble + push multi-arch manifest
        id: manifest
        run: |
          IMG="${IMAGE_REGISTRY}/${REGISTRY_NAMESPACE}/openshell-sandbox-base"
          podman manifest create "${IMG}:latest"
          podman manifest add "${IMG}:latest" "docker://${IMG}:latest-amd64"
          podman manifest add "${IMG}:latest" "docker://${IMG}:latest-arm64"
          podman manifest push --all --digestfile /tmp/base-manifest.digest \
            "${IMG}:latest" "docker://${IMG}:latest"
          podman manifest inspect "${IMG}:latest"
          DIGEST="$(cat /tmp/base-manifest.digest)"
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  # ---- Thin layers: build each (image × arch) with buildah, then merge per image ----
  layers:
    if: github.event_name != 'pull_request'
    needs: base-manifest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { dir: standard,     name: openshell-sandbox }
          - { dir: docs,         name: openshell-sandbox-docs }
          - { dir: speckit,      name: openshell-sandbox-speckit }
          - { dir: speckit-docs, name: openshell-sandbox-speckit-docs }
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure buildah/podman
        run: |
          command -v buildah >/dev/null && command -v podman >/dev/null || \
            { sudo apt-get update && sudo apt-get install -y buildah podman; }

      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build layer ${{ matrix.image.name }} (${{ matrix.arch }})
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with:
          image: ${{ matrix.image.name }}
          tags: latest-${{ matrix.arch }}
          archs: ${{ matrix.arch }}
          containerfiles: ./sandbox/${{ matrix.image.dir }}/Containerfile
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/openshell-sandbox-base@${{ needs.base-manifest.outputs.digest }}

      # speckit-docs carries its own toolchain (D2, Java 21 + Structurizr,
      # Mermaid securityLevel config) on top of base — audit it before push.
      - name: Audit diagram toolchain (speckit-docs, ${{ matrix.arch }})
        if: matrix.image.name == 'openshell-sandbox-speckit-docs'
        run: |
          IMG="localhost/openshell-sandbox-speckit-docs:latest-${{ matrix.arch }}"
          podman run --rm --entrypoint d2 "$IMG" --version
          podman run --rm --entrypoint java "$IMG" -version
          podman run --rm --entrypoint structurizr "$IMG" version
          # Smoke: D2 render
          podman run --rm --entrypoint bash "$IMG" -c '
            set -euxo pipefail
            cd "$(mktemp -d)"
            printf "x -> y: hello\n" > smoke.d2
            d2 smoke.d2 smoke.svg
            test -s smoke.svg
          '
          # Smoke: the no-browser pipeline — DSL -> Mermaid export -> mmdc SVG
          podman run --rm --entrypoint bash "$IMG" -c '
            set -euxo pipefail
            cd "$(mktemp -d)"
            cat > workspace.dsl <<"EOF"
          workspace {
            model {
              user = person "User"
              sys = softwareSystem "System"
              user -> sys "uses"
            }
            views {
              systemContext sys "Context" {
                include *
                autolayout
              }
            }
          }
          EOF
            structurizr validate -workspace workspace.dsl
            structurizr export -format mermaid -workspace workspace.dsl -output out
            test -s out/structurizr-Context.mmd
            mmdc -i out/structurizr-Context.mmd -o out/Context.svg -b white
            test -s out/Context.svg
          '

      - name: Push layer ${{ matrix.image.name }} (${{ matrix.arch }})
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3
        with:
          image: ${{ matrix.image.name }}
          tags: latest-${{ matrix.arch }}
          registry: ${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}

  # ---- PR validation for the speckit-docs layer (build-only, no publish) ----
  # The layers job above only runs post-merge; this job makes the PR its own
  # acceptance test for the speckit-docs diagram toolchain. It builds the
  # layer FROM the published base tag (the PR cannot reference the not-yet-
  # published manifest digest) and runs the same audit as the publish path.
  speckit-docs-validate:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure buildah/podman
        run: |
          command -v buildah >/dev/null && command -v podman >/dev/null || \
            { sudo apt-get update && sudo apt-get install -y buildah podman; }

      - name: Build layer openshell-sandbox-speckit-docs (${{ matrix.arch }})
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3
        with:
          image: openshell-sandbox-speckit-docs
          tags: latest-${{ matrix.arch }}
          archs: ${{ matrix.arch }}
          containerfiles: ./sandbox/speckit-docs/Containerfile
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/openshell-sandbox-base:latest

      - name: Audit diagram toolchain (speckit-docs, ${{ matrix.arch }})
        run: |
          IMG="localhost/openshell-sandbox-speckit-docs:latest-${{ matrix.arch }}"
          podman run --rm --entrypoint d2 "$IMG" --version
          podman run --rm --entrypoint java "$IMG" -version
          podman run --rm --entrypoint structurizr "$IMG" version
          # Smoke: D2 render
          podman run --rm --entrypoint bash "$IMG" -c '
            set -euxo pipefail
            cd "$(mktemp -d)"
            printf "x -> y: hello\n" > smoke.d2
            d2 smoke.d2 smoke.svg
            test -s smoke.svg
          '
          # Smoke: the no-browser pipeline — DSL -> Mermaid export -> mmdc SVG
          podman run --rm --entrypoint bash "$IMG" -c '
            set -euxo pipefail
            cd "$(mktemp -d)"
            cat > workspace.dsl <<"EOF"
          workspace {
            model {
              user = person "User"
              sys = softwareSystem "System"
              user -> sys "uses"
            }
            views {
              systemContext sys "Context" {
                include *
                autolayout
              }
            }
          }
          EOF
            structurizr validate -workspace workspace.dsl
            structurizr export -format mermaid -workspace workspace.dsl -output out
            test -s out/structurizr-Context.mmd
            mmdc -i out/structurizr-Context.mmd -o out/Context.svg -b white
            test -s out/Context.svg
          '

  layers-manifest:
    if: github.event_name != 'pull_request'
    needs: layers
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - openshell-sandbox
          - openshell-sandbox-docs
          - openshell-sandbox-speckit
          - openshell-sandbox-speckit-docs
    runs-on: ubuntu-latest
    steps:
      - name: Ensure podman
        run: command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }

      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble + push manifest for ${{ matrix.name }}
        run: |
          IMG="${IMAGE_REGISTRY}/${REGISTRY_NAMESPACE}/${{ matrix.name }}"
          podman manifest create "${IMG}:latest"
          podman manifest add "${IMG}:latest" "docker://${IMG}:latest-amd64"
          podman manifest add "${IMG}:latest" "docker://${IMG}:latest-arm64"
          podman manifest push --all "${IMG}:latest" "docker://${IMG}:latest"
          podman manifest inspect "${IMG}:latest"
