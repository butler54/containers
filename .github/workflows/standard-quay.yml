name: Build and Push 'standard-quay' containers with podman

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'

env:
  REGISTRY_USER: rh-ee-chbutler
  IMAGE_REGISTRY: quay.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: ['coredumps', 'build-utils', 'ssh-client']
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Log in to Quay.io
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
      with:
        username: ${{ env.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        registry: ${{ env.IMAGE_REGISTRY }}

    - name: Build Image
      id: build-image
      uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3
      with:
        image: ${{ matrix.containers }}
        tags: latest 
        containerfiles: |
         ./standard-quay/${{ matrix.containers }}/Containerfile


    - name: Push To quay.io
      id: push-to-quay
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3
      with:
        image: ${{ matrix.containers }}
        tags: latest
        registry: quay.io/${{ env.REGISTRY_USER }}